name: ARC tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Hub unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Hub sources
        run: python -m py_compile vds/arc_hub.py vds/arc_admin.py
      - name: Check VDS bootstrap bash syntax
        run: |
          bash -n scripts/install-vds.sh
          bash -n vds/install-vds.sh
          bash scripts/install-vds.sh --help | grep -q "ARC Hub quick installer"

      - name: Check dashboard JavaScript
        run: node --check vds/web/app.js
      - name: Check existing deployment update syntax
        run: bash -n scripts/update-web.sh
